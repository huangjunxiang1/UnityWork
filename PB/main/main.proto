syntax = "proto3";
package main;

// ==========================================
// 辅助定义：枚举、空消息、基础子消息、递归消息
// ==========================================

enum Status {
  STATUS_UNKNOWN = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
}

message c2s_aaa{}
message s2c_aaa{}
message C2s_aaaa{}
message S2c_aaaa{}

// 空消息
message Empty {}

// 基础子消息（用于数组、字典、联合体）
message ChildMessage {
  int32 id = 1;
  string name = 2;
}

// 消息自引用（树形递归结构）
message TreeNode {
  int32 id = 1;
  TreeNode left = 2;
  TreeNode right = 3;
}

// ==========================================
// 终极全覆盖测试协议
// ==========================================
message AllTypesMessage {
  
  // --- 1. 穷尽所有 15 种基础标量类型 ---
  double double_f = 1;
  float float_f = 2;
  int32 int32_f = 3;
  int64 int64_f = 4;
  uint32 uint32_f = 5;
  uint64 uint64_f = 6;
  sint32 sint32_f = 7;
  sint64 sint64_f = 8;
  fixed32 fixed32_f = 9;
  fixed64 fixed64_f = 10;
  sfixed32 sfixed32_f = 11;
  sfixed64 sfixed64_f = 12;
  bool bool_f = 13;
  string string_f = 14;
  bytes bytes_f = 15;

  // --- 2. Optional 可选修饰（涵盖标量、bytes、枚举、消息） ---
  optional int32 opt_int32 = 16;
  optional string opt_string = 17;
  optional bytes opt_bytes = 18;
  optional bool opt_bool = 19;
  optional Status opt_enum = 20;
  optional ChildMessage opt_msg = 21;

  // --- 3. Repeated 数组组合（涵盖所有可用作数组的类型） ---
  repeated double rep_double = 22;
  repeated float rep_float = 23;
  repeated int32 rep_int32 = 24;
  repeated uint64 rep_uint64 = 25;
  repeated bool rep_bool = 26;
  repeated string rep_string = 27;
  repeated bytes rep_bytes = 28;
  repeated Status rep_enum = 29;
  repeated ChildMessage rep_msg = 30;

  // --- 4. Map 字典组合（极其穷尽） ---
  // 4.1 穷尽所有 12 种合法的 Map Key 类型 (10种整型 + bool + string)
  map<int32, string> map_k_i32 = 31;
  map<int64, double> map_k_i64 = 32;
  map<uint32, float> map_k_u32 = 33;
  map<uint64, bool> map_k_u64 = 34;
  map<sint32, int32> map_k_si32 = 35;
  map<sint64, int64> map_k_si64 = 36;
  map<fixed32, uint32> map_k_f32 = 37;
  map<fixed64, uint64> map_k_f64 = 38;
  map<sfixed32, sint32> map_k_sf32 = 39;
  map<sfixed64, sint64> map_k_sf64 = 40;
  map<bool, string> map_k_bool = 41;
  map<string, bytes> map_k_str = 42;
  
  // 4.2 Map 的值涵盖枚举和消息
  map<string, Status> map_v_enum = 43;
  map<string, ChildMessage> map_v_msg = 44;

  // --- 5. OneOf 联合体（涵盖标量、bytes、枚举、消息） ---
  // 注意：oneof 内部不能包含 repeated 或 map
  oneof my_union {
    int32 union_int = 45;
    string union_str = 46;
    bytes union_bytes = 47;
    Status union_enum = 48;
    ChildMessage union_msg = 49;
  }

  // --- 6. 深度嵌套定义（Message 内部定义 Message） ---
  InnerNested nested_data = 50;
  message InnerNested {
    int32 deep_id = 1;
    message Deepest {
      string data = 1;
    }
    Deepest deepest = 2;
  }

  // --- 7. 递归/自引用结构 ---
  TreeNode tree_root = 51;

  // --- 8. 空消息引用（常用于无参 RPC 或占位） ---
  Empty empty_data = 52;
}